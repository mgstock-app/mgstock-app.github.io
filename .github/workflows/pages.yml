name: Publish mgstock
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Un despliegue de GitHub Pages puede quedar esperando una aprobación obsoleta.
# Usar un grupo nuevo libera la cola anterior; futuras publicaciones reemplazan las viejas.
concurrency:
  group: mgstock-pages-recovered-20261105
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'mgstock-app/mgstock-app.github.io'
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: https://gestlok.com.ar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            modules/empleados/package-lock.json
      - run: npm ci
      - name: Lectores de PDF y fotos (librerías gratuitas desde npm)
        run: node scripts/vendor-ocr.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Módulo «Administrar a los empleados» (cliente de ReciboNet integrado)
        run: |
          npm --prefix modules/empleados ci
          npm --prefix modules/empleados run lint
          npm --prefix modules/empleados test
          npm --prefix modules/empleados run build
          rm -rf out/empleados && cp -r modules/empleados/out out/empleados
          test -f out/empleados/index.html
      - name: Ambas áreas disponibles sin conexión (lista de Empleados en el service worker)
        run: node scripts/sw-precache.mjs out
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
