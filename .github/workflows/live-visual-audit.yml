name: GESTLOK · Auditoría visual del sitio publicado
on:
  pull_request:
    paths:
      - scripts/audit-live-responsive.mjs
      - .github/workflows/live-visual-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar navegador de automatización (Chrome del runner)
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          mkdir -p /tmp/gestlok-live-audit
          npm --prefix /tmp/gestlok-live-audit install playwright-core@1.56.1 --no-save --no-package-lock
      - name: Capturas reales de gestlok.com.ar (360, 390, 430, 768 y 1280 px)
        run: node scripts/audit-live-responsive.mjs
      - name: Conservar resultados y capturas, incluso si el dominio falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gestlok-live-visual-${{ github.run_id }}
          path: artifacts/gestlok-live/
          if-no-files-found: warn
