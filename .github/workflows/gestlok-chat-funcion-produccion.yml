# Publica la función «gestlok-chat» de producción (gestlok.com.ar) desde main, a mano.
# Solo corre si alguien con permisos en el repositorio la lanza desde Actions → «Run workflow» y escribe PUBLICAR.
# Requiere el secreto SUPABASE_PROD_DEPLOY_TOKEN (token personal de Supabase de la administradora). No toca la base:
# las migraciones de producción se siguen aplicando aparte.
name: GESTLOK Chat · publicar función en producción

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribí PUBLICAR para actualizar la función gestlok-chat de gestlok.com.ar'
        required: true

permissions:
  contents: read

concurrency:
  group: gestlok-chat-funcion-produccion
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main' && inputs.confirmar == 'PUBLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: El motor del chat y el de la función son el mismo
        run: cmp public/chat/motor.js supabase/functions/gestlok-chat/motor.js
      - name: Pruebas del motor
        run: node --test tests/gestlok-chat-motor.test.mjs tests/gestlok-chat-venta-sugerida-rubros.test.mjs
      - name: Publicar gestlok-chat (sin verificación JWT, como hoy)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_PROD_DEPLOY_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npx --yes supabase@2 functions deploy gestlok-chat --project-ref vgsepaaewbctjsjcpeta --use-api --no-verify-jwt
