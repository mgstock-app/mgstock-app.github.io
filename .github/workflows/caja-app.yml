name: Caja app · pruebas
# Micro app de caja (carpeta caja-app/, independiente de GESTLOK). Reglas, seguridad y concurrencia
# sobre un PostgreSQL 16 vacío. No usa la base de producción ni credenciales.
on:
  pull_request:
    branches: [main]
    paths: ['caja-app/**', '.github/workflows/caja-app.yml']
  push:
    branches: [main]
    paths: ['caja-app/**', '.github/workflows/caja-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Base de datos (reglas, seguridad y concurrencia)
        env:
          CAJA_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test caja-app/tests/
