name: Cypress MG Stock
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            modules/empleados/package-lock.json
      - run: npm ci
      - name: Lectores de PDF y fotos (librerías gratuitas desde npm)
        run: node scripts/vendor-ocr.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Módulo «Administrar a los empleados» (cliente de ReciboNet integrado)
        run: |
          npm --prefix modules/empleados ci
          npm --prefix modules/empleados run lint
          npm --prefix modules/empleados test
          npm --prefix modules/empleados run build
          rm -rf out/empleados && cp -r modules/empleados/out out/empleados
          test -f out/empleados/index.html
      - name: Instalar Cypress aislado
        run: npm --prefix qa install --no-package-lock
      - name: Iniciar servidor de pruebas
        run: |
          npm start > /tmp/mgstock-cypress.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/mgstock-cypress.log
          exit 1
      - name: Cypress E2E
        run: |
          set -o pipefail
          npm --prefix qa test 2>&1 | tee /tmp/cypress.log
      - name: Resumen de fallos
        if: failure()
        run: sed 's/\x1b\[[0-9;]*m//g' /tmp/cypress.log | grep -aE -A8 "CypressError|AssertionError" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Capturas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mgstock-cypress-failures
          path: qa/cypress/screenshots
          if-no-files-found: ignore
