name: Caja diaria · PostgreSQL
# Reglas, seguridad y concurrencia (varias sesiones a la vez, como dos equipos) de la caja diaria
# sobre un PostgreSQL 16 real y vacío. No usa la base de producción ni credenciales.
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261101190000_gestlok_caja_diaria_empresa.sql'
      - 'supabase/migrations/20261102130000_gestlok_caja_app_por_empresa.sql'
      - 'supabase/operaciones/gestlok-caja-app-perfumes.sql'
      - 'tests/fixtures/caja-diaria/**'
      - 'tests/db/**'
      - '.github/workflows/caja-diaria-db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261101190000_gestlok_caja_diaria_empresa.sql'
      - 'supabase/migrations/20261102130000_gestlok_caja_app_por_empresa.sql'
      - 'supabase/operaciones/gestlok-caja-app-perfumes.sql'
      - 'tests/fixtures/caja-diaria/**'
      - 'tests/db/**'
      - '.github/workflows/caja-diaria-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: psql --version
      - name: Reglas, seguridad y concurrencia
        env:
          CAJA_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test tests/db/caja-diaria-postgres.test.mjs
