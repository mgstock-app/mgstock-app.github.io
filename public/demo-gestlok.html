<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GESTLOK · Vista previa interactiva</title><style>:root{font-family:system-ui;color:#172c40;background:#eef4f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:20px 0;overflow:hidden}.brand{padding:0 20px}.screen-wrap{position:relative;margin:16px 7%;isolation:isolate}.screen-wrap:before,.screen-wrap:after{content:"";position:absolute;top:22px;bottom:22px;width:11%;border-radius:22px;background:linear-gradient(140deg,#dbeefa,#edf3ff);box-shadow:0 8px 20px #163d5b12;pointer-events:none;z-index:-1}.screen-wrap:before{right:calc(100% + 8px)}.screen-wrap:after{left:calc(100% + 8px)}.brand{text-align:center;color:#145b88}h1{margin:4px}.screen{touch-action:pan-y;transition:opacity .18s ease,transform .18s ease;background:white;border-radius:24px;padding:22px;min-height:520px;box-shadow:0 10px 35px #163d5b17}h2{margin-top:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid #d9e8f1;border-radius:18px;padding:22px 12px;background:#f8fbff;text-align:center;cursor:pointer;font-weight:700}.tile:hover,.tile:focus{border-color:#1686ba;background:#eaf6ff}.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.nav button,.action{border:0;background:#126c9c;color:white;border-radius:12px;padding:12px 17px;cursor:pointer}.nav button:disabled{opacity:.4}.dots{display:flex;justify-content:center;gap:8px}.dots button{border:2px solid #126c9c;border-radius:50%;width:13px;height:13px;padding:0;background:transparent;cursor:pointer;transition:transform .2s,background .2s}.dots button:focus-visible{outline:3px solid #f6b83f;outline-offset:4px}.dots .on{background:#126c9c;transform:scale(1.3)}.screen.slide-next{animation:slideNext .28s ease-out}.screen.slide-prev{animation:slidePrev .28s ease-out}@keyframes slideNext{from{opacity:.5;transform:translateX(38px)}to{opacity:1;transform:translateX(0)}}@keyframes slidePrev{from{opacity:.5;transform:translateX(-38px)}to{opacity:1;transform:translateX(0)}}@media(prefers-reduced-motion:reduce){.screen.slide-next,.screen.slide-prev{animation:none}}input,textarea,select{font:inherit;border:1px solid #c6d8e2;border-radius:10px;padding:10px;max-width:100%}label{display:block;margin:12px 0}.muted{color:#60788a}.menu{display:flex;gap:8px;overflow:auto;margin:12px 0}.menu span{white-space:nowrap;background:#e9f4fa;padding:8px;border-radius:10px}.panel{border:1px solid #d9e8f1;padding:16px;border-radius:14px;margin-top:12px}.stars button{font-size:32px;background:none;border:0;cursor:pointer}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0}button:focus-visible{outline:3px solid #f6b83f}</style><main class="app"><header class="brand"><h1>GESTLOK</h1><p>Organizá tu negocio, simplificá tu día</p></header><div class="screen-wrap"><section class="screen" id="screen" aria-live="polite"></section></div><div class="dots" id="dots" role="group" aria-label="Elegir etapa de la demo"></div><div class="nav"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div><p class="muted" style="text-align:center">Demo con información ficticia · Deslizá cuando quieras</p></main><script>
const state={step:0,card:'',stock:12,orders:[],staff:'Lucía',shift:'09:00–17:00',rating:0,comment:'',public:false,contact:false};const el=document.getElementById('screen');const names=['Inicio','Stock','Proveedores','Personal','Tu opinión'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function move(n){const next=Math.max(0,Math.min(4,n));if(next===state.step)return;const previous=state.step;state.step=next;render();el.classList.remove('slide-next','slide-prev');void el.offsetWidth;el.classList.add(next>previous?'slide-next':'slide-prev')}function render(){document.getElementById('dots').innerHTML=names.map((n,i)=>'<button type="button" aria-label="Etapa '+(i+1)+': '+n+'" aria-current="'+(i===state.step?'step':'false')+'" title="'+n+'" class="'+(i===state.step?'on':'')+'" onclick="move('+i+')"></button>').join('');document.getElementById('prev').disabled=state.step===0;document.getElementById('next').disabled=state.step===4;let h='';if(state.step===0){h='<h2>1. Conocé tu inicio</h2><p>Estas son las tarjetas principales. Tocá cualquiera para entrar y descubrir el menú. Podés deslizar a otra etapa cuando quieras.</p><div class="cards">'+['Administración del local','Empleados y horarios','Proveedores','Reportes'].map((x,i)=>'<button class="tile" onclick="openCard('+i+')">'+['▦','◷','▤','▥'][i]+'<p>'+x+'</p></button>').join('')+'</div>'+(state.card?'<div class="panel"><b>'+esc(state.card)+'</b><div class="menu"><span>Inicio</span><span>Planillas</span><span>Historial</span><span>Configuración</span></div><p>¡Este es el menú de GESTLOK! Aquí termina esta interacción guiada.</p><button class="action" onclick="state.card=\'\';render()">Volver a tarjetas</button></div>':'')}if(state.step===1){h='<h2>2. Administrá tu stock</h2><p>Probá un conteo: modificá las unidades y guardá el resultado. Es una simulación sin datos reales.</p><div class="panel"><div class="row"><b>Empanadas (ejemplo)</b><span>Stock: <b id="qty">'+state.stock+'</b></span></div><div class="row"><button class="action" onclick="stock(-1)">− 1</button><button class="action" onclick="stock(1)">+ 1</button></div><button class="action" onclick="document.getElementById(\'stockMsg\').textContent=\'Conteo ficticio guardado: \'+state.stock+\' unidades\'">Guardar conteo</button><p id="stockMsg" role="status"></p></div>'}if(state.step===2){h='<h2>3. Pedidos a proveedores</h2><p>Elegí cantidades, agregalas al pedido y visualizá el resumen listo para exportar.</p><div class="panel"><label>Producto <select id="prod"><option>Harina</option><option>Queso</option><option>Envases</option></select></label><label>Cantidad <input type="number" id="amount" min="1" value="5"></label><button class="action" onclick="addOrder()">Agregar al pedido</button><div id="orderList">'+orderText()+'</div><button class="action" onclick="printOrder()">Vista de impresión / PDF</button></div>'}if(state.step===3){h='<h2>4. Empleados, horarios y recibos</h2><p>Modificá un turno ficticio y consultá un recibo de ejemplo. El chat interno se presenta en el menú.</p><div class="panel"><b>Empleado: '+state.staff+'</b><label>Horario <select id="shift" onchange="state.shift=this.value"><option '+(state.shift==='09:00–17:00'?'selected':'')+'>09:00–17:00</option><option '+(state.shift==='14:00–22:00'?'selected':'')+'>14:00–22:00</option></select></label><button class="action" onclick="document.getElementById(\'shiftMsg\').textContent=\'Turno de ejemplo guardado: \'+state.shift">Guardar horario</button><p id="shiftMsg" role="status"></p><details><summary>Ver recibo ficticio</summary><p>Recibo demostrativo · '+state.staff+' · Sin validez legal</p></details><details><summary>Chat interno</summary><p>Mensajes entre miembros autorizados de la empresa.</p></details></div>'}if(state.step===4){h='<div style="text-align:center"><h1>GESTLOK</h1><p>Organizá tu negocio, simplificá tu día</p><h2>¡Gracias por conocernos!</h2></div><p>¿Qué te pareció la aplicación? Tu comentario es opcional. Las reseñas de GESTLOK son independientes de las reseñas de los locales.</p><div class="stars" role="group" aria-label="Calificación">'+[1,2,3,4,5].map(n=>'<button aria-label="'+n+' estrellas" onclick="state.rating='+n+';render()">'+(n<=state.rating?'★':'☆')+'</button>').join('')+'</div><label>Comentario (opcional)<textarea id="comment" rows="3" placeholder="Contanos tu experiencia">'+esc(state.comment)+'</textarea></label><label><input id="public" type="checkbox" '+(state.public?'checked':'')+'> Autorizo la publicación de mi reseña</label><label><input id="contact" type="checkbox" '+(state.contact?'checked':'')+' onchange="state.contact=this.checked;document.getElementById(\'contactFields\').hidden=!this.checked"> Quiero que me contacten por planes y suscripciones</label><div id="contactFields" '+(!state.contact?'hidden':'')+'><label>Nombre <input id="customer"></label><label>Correo o teléfono <input id="channel"></label><label><input id="contactConsent" type="checkbox"> Autorizo el uso de estos datos exclusivamente para contactarme</label></div><button class="action" onclick="submitReview()">Enviar reseña</button><p class="muted">Vista previa: no envía datos ni activa promociones.</p><p id="reviewMsg" role="status"></p>'}el.innerHTML=h}function openCard(i){state.card=['Administración del local','Empleados y horarios','Proveedores','Reportes'][i];render()}function stock(d){state.stock=Math.max(0,state.stock+d);document.getElementById('qty').textContent=state.stock}function orderText(){return state.orders.length?'<h3>Pedido ficticio</h3><ul>'+state.orders.map(x=>'<li>'+esc(x.name)+': '+x.qty+'</li>').join('')+'</ul>':'<p class="muted">Todavía no agregaste productos.</p>'}function addOrder(){const q=Number(document.getElementById('amount').value);if(!Number.isInteger(q)||q<1)return alert('Ingresá una cantidad válida');state.orders.push({name:document.getElementById('prod').value,qty:q});document.getElementById('orderList').innerHTML=orderText()}function printOrder(){if(!state.orders.length)return alert('Agregá un producto primero');const w=window.open('','_blank');if(!w)return alert('Habilitá ventanas emergentes para ver el PDF');w.document.write('<h1>GESTLOK · Pedido ficticio</h1>'+orderText()+'<p>Usá Imprimir → Guardar como PDF</p>');w.document.close();w.print()}function submitReview(){state.comment=document.getElementById('comment').value;state.public=document.getElementById('public').checked;if(!state.rating)return alert('Seleccioná las estrellas');if(document.getElementById('contact').checked){if(!document.getElementById('customer').value.trim()||!document.getElementById('channel').value.trim()||!document.getElementById('contactConsent').checked)return alert('Para solicitar contacto, completá los datos y autorizá su uso')}document.getElementById('reviewMsg').textContent='Vista previa completada. ¡Gracias! La reseña no se envió. Los regalos y la suscripción se activarán únicamente en la versión final aprobada.'}let x=0,y=0;el.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{if(e.target.closest('input,textarea,select,button,.menu'))return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)move(state.step+(dx<0?1:-1))},{passive:true});document.getElementById('prev').onclick=()=>move(state.step-1);document.getElementById('next').onclick=()=>move(state.step+1);render();
</script></html>
