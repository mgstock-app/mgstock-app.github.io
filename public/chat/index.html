<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Hacé tu pedido por chat. Atención virtual del local con GESTLOK Chat.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Pedidos por chat · GESTLOK Chat</title>
<link rel="icon" href="/chat/gestlok-monograma.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/gestlok-apple-v2-180.png">
<link rel="manifest" href="/chat/manifest.webmanifest">
<link rel="stylesheet" href="/chat/chat.css?v=20261122vermenu2">
</head>
<body>
<div class="app" id="app" aria-busy="true">
  <header class="cabecera">
    <div class="avatar" id="avatar" aria-hidden="true">G</div>
    <div class="cabecera-texto">
      <h1 id="titulo">Cargando…</h1>
      <p id="subtitulo">Chat de atención y pedidos</p>
    </div>
    <button class="icono" id="btn-notificaciones" type="button" aria-label="Notificaciones del local" title="Notificaciones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
    </button>
    <button class="icono" id="btn-info" type="button" aria-label="Horario, envío y pagos" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    </button>
  </header>
  <div class="aviso-pedido" id="aviso-pedido" role="status" aria-live="polite" hidden></div>
  <main class="mensajes" id="mensajes" aria-live="polite" aria-relevant="additions"></main>
  <div class="chat-inferior">
  <div class="barra-pedido" id="barra-pedido" hidden>
    <button type="button" id="btn-carrito" class="barra-resumen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h15l-1.6 8.2a2 2 0 0 1-2 1.6H9.1a2 2 0 0 1-2-1.6L5 3H3"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span id="barra-texto">Tu pedido</span>
    </button>
    <a id="whatsapp-local" class="chat-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="Abrir WhatsApp del local" title="WhatsApp" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.966-.273-.1-.472-.148-.67.15-.198.297-.767.966-.94 1.164-.173.198-.347.223-.644.074-.297-.148-1.255-.463-2.39-1.475-.883-.788-1.48-1.76-1.653-2.057-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.15-.174.198-.298.297-.496.1-.198.05-.371-.025-.52-.074-.148-.669-1.611-.916-2.206-.242-.579-.487-.5-.67-.51-.173-.008-.372-.01-.57-.01-.198 0-.52.074-.792.371-.272.297-1.04 1.016-1.04 2.479s1.065 2.876 1.213 3.074c.15.198 2.095 3.2 5.075 4.487.709.306 1.262.489 1.692.625.71.226 1.357.194 1.868.118.57-.085 1.758-.718 2.005-1.412.248-.694.248-1.29.174-1.412-.074-.124-.272-.198-.57-.347m-5.473 7.542h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.262c.002-5.45 4.436-9.885 9.89-9.885a9.83 9.83 0 0 1 6.994 2.899 9.83 9.83 0 0 1 2.895 6.994c-.003 5.45-4.438 9.886-9.895 9.886m8.413-18.299A11.8 11.8 0 0 0 12.002 0C5.392 0 .014 5.377.011 11.987a11.94 11.94 0 0 0 1.6 5.97L0 24l6.196-1.627A11.97 11.97 0 0 0 11.995 24h.005c6.611 0 11.99-5.377 11.993-11.988A11.9 11.9 0 0 0 20.413 3.625z"/></svg><span>WhatsApp</span>
</a>
    <button type="button" class="boton principal" id="btn-finalizar">Finalizar</button>
  </div>
  <form class="redactar" id="redactar" autocomplete="off">
    <button type="button" class="icono carta" id="btn-carta" aria-label="Ver la carta" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
    </button>
    <button type="button" class="icono foto" id="btn-galeria" aria-label="Adjuntar comprobante o foto" title="Adjuntar foto">📎</button>
    <button type="button" class="icono foto" id="btn-camara" aria-label="Sacar foto" title="Tomar foto">📷</button>
    <input id="foto-galeria" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <input id="foto-camara" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
    <label class="oculto" for="texto">Escribí tu mensaje</label>
    <textarea id="texto" rows="1" maxlength="600" placeholder="Escribí tu mensaje…" enterkeyhint="send" disabled></textarea>
    <button type="submit" class="icono enviar" id="btn-enviar" aria-label="Enviar" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-2.5-6.5z"/></svg>
    </button>
  </form>
  </div>
  <p class="pie">Atención virtual con <strong>GESTLOK Chat</strong> · <a href="https://gestlok.com.ar/privacidad.html" target="_blank" rel="noopener">Privacidad</a></p>
</div>
<div class="fondo-hoja" id="fondo-hoja" hidden></div>
<section class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden>
  <div class="hoja-cabecera">
    <h2 id="hoja-titulo"></h2>
    <button class="icono" type="button" id="hoja-cerrar" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
</section>
<noscript><p class="sin-js">Para hacer tu pedido activá JavaScript en el navegador.</p></noscript>
<script src="/chat/config.js?v=20261119a"></script>
<script src="/chat/showroom-bridge.js?v=20261120showroom1"></script>
<script defer src="/chat/cliente-push.js?v=20261121cliente1"></script>
<script type="module" src="/chat/chat.js?v=20261123efectivo1"></script>
</body>
</html>
