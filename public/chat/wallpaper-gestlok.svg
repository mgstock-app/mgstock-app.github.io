<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice">
  <title>Fondo claro de GESTLOK Chat</title>
  <!-- Papel plata muy claro con planos geométricos amplios. Sin dibujos ni marcas repetidas. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf0f4"/>
      <stop offset="34%" stop-color="#f8f9fb"/>
      <stop offset="70%" stop-color="#f1f3f6"/>
      <stop offset="100%" stop-color="#e9edf1"/>
    </linearGradient>
    <radialGradient id="luz" cx=".35" cy=".45" r=".85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity=".21"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plano1" x1="0" y1="0" x2="1" y2=".8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#e3e8ee" stop-opacity=".17"/>
    </linearGradient>
