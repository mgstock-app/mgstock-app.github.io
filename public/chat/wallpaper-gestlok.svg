      <stop offset="0%" stop-color="#d9e0e8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1400" fill="url(#base)"/>
  <path d="M0 0H900V295L377 861 0 1195Z" fill="url(#plano1)"/>
  <path d="M900 255V1400H295Z" fill="url(#plano2)"/>
  <path d="M0 1010 325 703 900 0V158L295 852 0 1168Z" fill="#ffffff" opacity=".12"/>
  <path d="M0 0H450L0 570Z" fill="#ffffff" opacity=".1"/>
  <rect width="900" height="1400" fill="url(#luz)"/>
