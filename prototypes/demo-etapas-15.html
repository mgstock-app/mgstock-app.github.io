<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GESTLOK | Demo por etapas (prototipo)</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f1fc;background:#091426}*{box-sizing:border-box}body{margin:0;padding:22px 14px}.shell{max-width:620px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.08em}.pill{border:1px solid #415572;border-radius:24px;padding:7px 12px;font-size:12px}.progress{display:flex;gap:5px;margin:22px 0}.progress i{height:5px;flex:1;border-radius:10px;background:#33435b}.progress i.on{background:#57a6ff}.card{border:1px solid #334966;background:#12233b;border-radius:24px;padding:24px;min-height:380px;box-shadow:0 12px 40px #0003}h1{font-size:27px;margin:8px 0 12px}p{line-height:1.55;color:#c0cfe1}.eyebrow{color:#88baff;font-size:12px;letter-spacing:.09em;font-weight:700}.sample{background:#1c304b;border:1px solid #40536c;border-radius:14px;padding:14px;margin-top:18px}.sample strong{display:block;margin-bottom:8px}.sample button,button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;font-weight:650}.sample button{background:#2b486d;color:#fff;margin:5px 4px 0 0}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.nav button{background:#2774d6;color:white}.nav button.secondary{background:#283d58}.nav button:disabled{opacity:.4}textarea,input{width:100%;border:1px solid #4b607a;border-radius:10px;background:#0d1c30;color:#fff;padding:12px;margin-top:10px}label{display:block;margin-top:12px;font-size:14px}.stars{display:flex;gap:8px;margin:16px 0}.stars button{font-size:30px;background:none;color:#64748b;padding:0}.stars button.on{color:#f6c453}.hint{font-size:12px}.gift{padding:16px;background:#173c4e;border:1px solid #2d8b92;border-radius:14px;margin-top:14px}.hidden{display:none}footer{font-size:12px;color:#95a8c1;margin-top:18px}
</style></head><body><main class="shell"><header class="top"><span class="brand">GESTLOK</span><span class="pill">DEMO · DATOS FICTICIOS</span></header><div id="progress" class="progress"></div><section class="card" id="panel" aria-live="polite"></section><nav class="nav"><button class="secondary" id="back">← Anterior</button><button id="next">Siguiente →</button></nav><footer>Prototipo aislado. No guarda reseñas, no emite cupones reales ni consulta datos de empresas. No publicado en producción.</footer></main>
<script>
const stages=[
["Bienvenida","Descubrí una manera más simple de organizar tu negocio.","Explorá la demo","Una empresa ficticia, sin registro y sin datos reales."],
["Panel general","Visualizá las herramientas y los indicadores principales de tu empresa.","Resumen de ejemplo","Locales: 2 · Tareas pendientes: 3 · Alertas: 1"],
["Stock e inventario","Registrá entradas, ventas y conteos para detectar diferencias.","Inventario ficticio","Harina: 24 unidades · Aceite: 12 unidades"],
["Proveedores","Prepará pedidos, guardalos y conocé la exportación en PDF por WhatsApp.","Pedido de ejemplo","Proveedor Demo · Harina: 8 · Aceite: 4"],
["Empleados y horarios","Conocé cómo se organizan los turnos y permisos por rol.","Horario ficticio","Ana: 09–17 · Bruno: 12–20"],
["Comunicación","Explorá el chat interno y las notificaciones de gestión.","Mensaje de ejemplo","Equipo Demo: pedido preparado para revisión"],
["Reportes y vencimientos","Consultá movimientos, historial y alertas en un mismo lugar.","Reporte ficticio","Movimientos del día: 12 · Próximo vencimiento: 5 días"]
];
let step=0,stars=0,publicReview=false,feedback='',sampleChanged=false;
const panel=document.getElementById('panel'),progress=document.getElementById('progress'),back=document.getElementById('back'),next=document.getElementById('next');
function render(){
progress.innerHTML=Array.from({length:8},(_,i)=>'<i class="'+(i<=step?'on':'')+'"></i>').join('');
back.disabled=step===0;next.textContent=step===7?'Reiniciar demo':'Siguiente →';
if(step<7){const s=stages[step];panel.innerHTML='<div class="eyebrow">ETAPA '+(step+1)+' DE 8</div><h1>'+s[0]+'</h1><p>'+s[1]+'</p><div class="sample"><strong>'+s[2]+'</strong><p id="sampleText">'+s[3]+'</p><button id="try">Probar interacción ficticia</button></div><p class="hint">Podés volver atrás en cualquier momento. Los ejemplos no afectan datos reales.</p>';document.getElementById('try').onclick=()=>{sampleChanged=!sampleChanged;document.getElementById('sampleText').textContent=sampleChanged?'✓ Ejemplo actualizado en esta vista. Ningún dato real fue modificado.':s[3]};}
else{panel.innerHTML='<div class="eyebrow">ETAPA 8 DE 8</div><h1>¡Terminaste la demo!</h1><p>¿Qué te pareció GESTLOK? Tu opinión nos ayuda a mejorar. Recibís un regalo de bienvenida por participar, sin importar cuántas estrellas elijas.</p><div class="stars" id="stars"></div><label for="comment">Comentario (opcional)</label><textarea id="comment" rows="3" placeholder="Contanos tu experiencia"></textarea><label><input id="public" type="checkbox" style="width:auto;margin-right:8px">Autorizo que mi reseña se muestre públicamente</label><p class="hint">Sin autorización, la reseña será privada. Este prototipo no envía ni almacena opiniones.</p><button id="preview">Ver regalo de bienvenida</button><div id="gift" class="gift hidden"><strong>🎁 15% de descuento en tu primer mes</strong><p>Cupón ilustrativo: DEMO15. No válido para compras ni suscripciones. Su emisión real queda pendiente de aprobación.</p></div>';document.getElementById('comment').value=feedback;document.getElementById('public').checked=publicReview;drawStars();document.getElementById('comment').oninput=e=>feedback=e.target.value;document.getElementById('public').onchange=e=>publicReview=e.target.checked;document.getElementById('preview').onclick=()=>document.getElementById('gift').classList.remove('hidden');}}
function drawStars(){const el=document.getElementById('stars');el.innerHTML='';for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent='★';b.className=i<=stars?'on':'';b.setAttribute('aria-label',i+' estrellas');b.onclick=()=>{stars=i;drawStars()};el.appendChild(b)}}
back.onclick=()=>{step=Math.max(0,step-1);sampleChanged=false;render()};next.onclick=()=>{step=step===7?0:step+1;sampleChanged=false;render()};
let startX=null;panel.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});panel.addEventListener('touchend',e=>{if(startX===null)return;const delta=e.changedTouches[0].clientX-startX;startX=null;if(Math.abs(delta)<90||e.target.closest('textarea,input,button'))return;step=Math.min(7,Math.max(0,step+(delta<0?1:-1)));render()},{passive:true});render();
</script></body></html>
